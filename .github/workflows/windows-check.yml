name: windows-check

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get AutoHotkey v2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rels = Invoke-RestMethod 'https://api.github.com/repos/AutoHotkey/AutoHotkey/releases?per_page=20' -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $rel = $rels | Where-Object { $_.tag_name -like 'v2.*' -and -not $_.prerelease } | Select-Object -First 1
          $url = ($rel.assets | Where-Object { $_.name -like 'AutoHotkey_*.zip' } | Select-Object -First 1).browser_download_url
          Write-Host "AutoHotkey $($rel.tag_name): $url"
          Invoke-WebRequest $url -OutFile ahk.zip
          Expand-Archive ahk.zip -DestinationPath ahk
          Get-ChildItem ahk | Select-Object Name

      - name: Validate script syntax
        shell: pwsh
        run: |
          $p = Start-Process ahk\AutoHotkey64.exe -ArgumentList '/ErrorStdOut=UTF-8','/validate','windows\xiaoning.ahk' -Wait -PassThru -NoNewWindow -RedirectStandardError err.txt -RedirectStandardOutput out.txt
          Get-Content err.txt, out.txt -Encoding UTF8
          if ($p.ExitCode -ne 0) { Write-Error "syntax check failed ($($p.ExitCode))"; exit 1 }

      - name: Self-test (JSON, SSE, streaming client against a mock API)
        shell: pwsh
        run: |
          $mock = Start-Process python -ArgumentList 'tests\mock_claude.py','18080' -PassThru -NoNewWindow
          Start-Sleep 2
          $p = Start-Process ahk\AutoHotkey64.exe -ArgumentList '/ErrorStdOut=UTF-8','windows\xiaoning.ahk','--selftest','http://127.0.0.1:18080/v1/messages' -Wait -PassThru -NoNewWindow -RedirectStandardOutput st.txt -RedirectStandardError st-err.txt
          Get-Content st.txt, st-err.txt -Encoding UTF8
          Stop-Process -Id $mock.Id -Force
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed ($($p.ExitCode))"; exit 1 }

      - name: Installer (Windows PowerShell 5.1, from this checkout)
        shell: powershell
        env:
          XN_SOURCE_DIR: ${{ github.workspace }}
          XN_API_KEY: test-key
          XN_ENDPOINT: http://127.0.0.1:18080/v1/messages
          XN_NO_START: '1'
        run: |
          $code = [IO.File]::ReadAllText("$env:GITHUB_WORKSPACE\install.ps1", [Text.Encoding]::UTF8)
          Invoke-Expression $code
          $dest = Join-Path $env:LOCALAPPDATA 'xiaoning-translate'
          foreach ($f in 'windows\xiaoning.ahk','AutoHotkey\AutoHotkey64.exe','config.ini','prompts\write.example.txt') {
            if (-not (Test-Path (Join-Path $dest $f))) { Write-Error "missing $f"; exit 1 }
          }
          $ini = Get-Content (Join-Path $dest 'config.ini') -Raw
          if ($ini -notmatch 'apiKey=test-key') { Write-Error "config.ini not written: $ini"; exit 1 }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Startup')) 'XiaoNing Translate.lnk'))) { Write-Error 'startup shortcut missing'; exit 1 }
          Write-Host "installer OK"

      - name: Installed app starts and stays running
        shell: pwsh
        env:
          XN_CI: '1'
        run: |
          $dest = Join-Path $env:LOCALAPPDATA 'xiaoning-translate'
          $p = Start-Process "$dest\AutoHotkey\AutoHotkey64.exe" -ArgumentList '/ErrorStdOut=UTF-8',"`"$dest\windows\xiaoning.ahk`"" -PassThru -RedirectStandardError run-err.txt
          Start-Sleep 6
          Get-Content run-err.txt -Encoding UTF8 -ErrorAction SilentlyContinue
          if ($p.HasExited) { Write-Error "app exited early with $($p.ExitCode)"; exit 1 }
          if ((Get-Item run-err.txt).Length -gt 0) { Write-Error "app wrote errors"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "app ran for 6s without errors"
